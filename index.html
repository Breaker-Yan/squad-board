<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad 看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #0e1218; --panel: #151b23; --panel-2: #1b2330; --ink: #e4e9f0; --muted: #8b97a8; --line: #263040;
  --accent: #6cb0ff; --pass: #4fc37e; --fail: #ff6b5f; --warn: #f2b84b; --info: #6cb0ff; --violet: #b394f0; --idle: #4d5868;
  --font-body: "IBM Plex Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
section, .panel, .agent, details, h2 { scroll-margin-top: 88px; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
a { color: inherit; }
.layout { max-width: 1320px; margin: 18px auto 0; }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; align-content: start; }
.rail { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; flex: 1 1 auto; }
.rail-box { display: flex; min-width: 0; min-height: 0; height: 248px; }
.top-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: 18px; align-items: stretch; }
.top-row > .needs { min-height: 248px; }
.rail-head { display: grid; gap: 8px; }
.rail-head h2 { margin: 0; }
.rail .feed li { grid-template-columns: 58px 10px 1fr; gap: 8px; font-size: 12.5px; padding: 4px; }
.rail .feed li.grp summary { grid-template-columns: 58px 10px 1fr; gap: 8px; padding: 4px; }
.rail-kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.rail-new { font: inherit; font-size: 12.5px; cursor: pointer; align-self: center; color: var(--bg); background: var(--accent); border: 0; border-radius: 999px; padding: 3px 12px; }
.rail .feed { flex: 1 1 auto; min-height: 0; max-height: none; }
.feed li.grp { display: block; padding: 0; }
.feed li.grp summary { display: grid; grid-template-columns: 64px 10px 1fr; gap: 10px; align-items: baseline; padding: 6px 4px; border-radius: 6px; cursor: pointer; list-style: none; }
.feed li.grp summary::-webkit-details-marker { display: none; }
.feed li.grp summary:hover { background: var(--panel-2); }
.feed li.grp summary span:last-child::after { content: " ▸"; color: var(--muted); }
.feed li.grp details[open] summary span:last-child::after { content: " ▾"; }
.feed.sub { margin: 0 0 6px 18px; padding-left: 8px; border-left: 1px solid var(--line); overflow: visible; min-height: 0; }
.feed li.evlink { cursor: pointer; }
.feed li.evlink:hover { background: var(--panel-2); }
.feed .tag { color: var(--accent); font-size: 11.5px; }
.items li.plan { display: block; }
.checklist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.checklist .mark { display: inline-block; width: 20px; color: var(--muted); }
.checklist li.done .mark { color: var(--pass); }
.closeout-tables { display: grid; gap: 6px; margin-bottom: 8px; }
.closeout-tables summary { cursor: pointer; font-size: 13px; }
table.mini { min-width: 0; font-size: 12px; margin: 6px 0; }
table.mini td { padding: 3px 6px; }
.demos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.demo { margin: 0; display: grid; gap: 6px; min-width: 0; }
.demo video, .dlg-body video { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #000; }
.demo figcaption { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 13px; }
.demo figcaption .s { color: var(--muted); font-size: 12px; margin-left: auto; }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 180px; overflow-y: auto; }
.chapter { font: inherit; font-size: 12.5px; color: var(--ink); background: transparent; border: 0; border-radius: 6px; padding: 3px 6px; width: 100%; text-align: left; cursor: pointer; }
.chapter:hover { background: var(--panel-2); }
.chapter .mono { color: var(--accent); margin-right: 6px; }
.demo-badge { margin-left: 8px; font-size: 11.5px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 999px; padding: 0 7px; cursor: pointer; }
.demo-badge:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.decisions { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 10px; }
.needs li.decision { display: grid; align-items: stretch; }
.decision { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.dhead .s { margin-left: auto; color: var(--muted); font-size: 12px; }
.recap { font-size: 13px; color: var(--ink); }
.dq { font-size: 13px; max-height: 9em; overflow-y: auto; }
.dopts { margin: 0; padding-left: 20px; display: grid; gap: 2px; }
.dopt { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0; padding: 2px 4px; border-radius: 4px; text-align: left; cursor: pointer; }
.dopt:hover { background: var(--panel); color: var(--accent); }
.dacts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.accept { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.dreply { display: flex; gap: 6px; align-items: flex-end; }
.dreply textarea { flex: 1; font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
.other-needs summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.issue-row { cursor: pointer; border-radius: 6px; padding: 4px; margin: -4px; }
.issue-row:hover { background: var(--panel-2); }
.issue-row.closed { opacity: .55; }
.issue-row.closed:hover { opacity: 1; }
.card[data-card] { font: inherit; color: inherit; text-align: left; cursor: pointer; }
.card[data-card]:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.card[aria-pressed="true"] { border-color: var(--accent); }
.ac-group { padding: 0 7px; font-size: 11.5px; color: var(--accent); }
.flink { color: var(--accent); text-decoration: none; }
.flink:hover { text-decoration: underline; }
.plan-files { margin-top: 8px; line-height: 1.8; }
.dlg-k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2 { margin: 0; }
.panel-head .filters { margin: 0; }
.plans-panel .items { gap: 6px; }
.plan details { background: var(--panel-2); border-radius: 8px; padding: 8px 12px; }
.plan summary { display: flex; gap: 12px; justify-content: space-between; align-items: center; cursor: pointer; list-style: none; }
.plan summary::-webkit-details-marker { display: none; }
.plan summary .what { flex: 1; min-width: 0; }
.plan summary .what::before { content: "▸ "; color: var(--muted); }
.plan details[open] summary .what::before { content: "▾ "; }
.plan .pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pbar { height: 4px; border-radius: 2px; background: var(--bg); margin: 6px 0 2px; max-width: 320px; overflow: hidden; }
.pbar span { display: block; height: 100%; background: var(--pass); }
.tasks { list-style: none; margin: 10px 0 2px; padding: 0; display: grid; gap: 2px; }
.task { display: grid; grid-template-columns: 16px 64px minmax(0, 1fr) 92px; gap: 8px; align-items: baseline; font-size: 12.5px; padding: 3px 0; border-top: 1px solid var(--line); }
.task .mark { color: var(--muted); }
.task.done .mark { color: var(--pass); }
.task .tid { color: var(--accent); }
.task .ttl { min-width: 0; }
.task .tnote { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .sha { color: var(--muted); font-size: 11.5px; text-align: right; }
.task-part { font-size: 12px; color: var(--muted); padding: 8px 0 2px; }
.side-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }

.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 18px; font-weight: 600; }
.crumb { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.crumb a { color: var(--accent); text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.live { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.live i { width: 9px; height: 9px; border-radius: 50%; background: var(--fail); }
.live.on i { background: var(--pass); animation: ping 1.8s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pass) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }

.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
button.chip { cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }

.needs { border-left: 3px solid var(--warn); }
.needs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.needs li { display: flex; gap: 10px; align-items: baseline; }
.needs .tag { font-size: 11.5px; color: var(--accent); white-space: nowrap; text-decoration: none; }
.needs .empty { color: var(--muted); }

.session { display: grid; gap: 10px; }
.session-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.session-head b { font-family: var(--font-mono); font-size: 13px; }
.brow { display: grid; grid-template-columns: minmax(220px, 1.4fr) minmax(140px, 1fr) minmax(160px, 1fr) minmax(200px, 1.3fr); gap: 16px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; text-decoration: none; }
.brow:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.brow.attn { border-left: 3px solid var(--fail); }
.brow.offline { opacity: .55; }
.brow .name { font-weight: 600; font-size: 15px; }
.brow .sub { font-size: 12px; color: var(--muted); }
.brow .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.brow .counts { font-size: 12px; color: var(--muted); margin-top: 4px; }
.brow .last { font-size: 12px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--panel-2); }
.bar span { height: 100%; transition: width .6s ease; }
.bwrap { position: relative; }
.bwrap .brow { padding-right: 96px; }
.bwrap .sub-btn, .bwrap > .sub { position: absolute; top: 10px; right: 10px; opacity: .55; }
.bwrap:hover > .sub, .bwrap > .sub:focus-visible { opacity: 1; }
.session-head .sub { margin-left: auto; }
.catalog summary { cursor: pointer; list-style-position: inside; }
.catalog[open] summary { margin-bottom: 12px; }
.cat-session + .cat-session { margin-top: 14px; }
.cat-list { display: grid; gap: 6px; margin-top: 8px; }
.cat-item { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel-2); border-radius: 8px; padding: 8px 12px; }
.cat-item .name { font-weight: 600; }
.archives .cat-item a.name { color: var(--ink); text-decoration: none; }
.archives .cat-item a.name:hover { color: var(--accent); }
.archives summary { cursor: pointer; }
.archives[open] summary { margin-bottom: 12px; }
.cat-item .sub { font-size: 12px; color: var(--muted); }
.cat-item > .chip.sub { margin-left: auto; }
.chip.new { color: var(--accent); border-color: var(--accent); }
.chip.sub-here { margin-left: 8px; }
.tally { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; }
.tally span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tally .z { color: var(--muted); }
.brow.compact { grid-template-columns: minmax(220px, 1.4fr) 3.3fr; padding-block: 9px; }
.brow.compact .name { font-size: 13.5px; font-weight: 500; }
.needs a.go { text-decoration: none; display: flex; gap: 10px; align-items: baseline; flex: 1; min-width: 0; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
.needs a.go:hover { background: var(--panel-2); }
.needs .where { font-size: 11.5px; color: var(--muted); white-space: nowrap; margin-left: auto; }
.badge-ok { font-size: 12.5px; color: var(--pass); }

.hero { display: flex; align-items: center; min-width: 0; }
.hero-main { flex: 1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; min-width: 0; }
.hero.flat .hero-main { grid-template-columns: 1fr; align-content: center; }
.top-row.bare { grid-template-columns: 1fr; }
.top-row.bare .rail-box { height: auto; max-height: 220px; }
.feed li.empty-feed { display: block; color: var(--muted); padding: 6px 4px; }
.ring { position: relative; width: 156px; height: 156px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .pct { font-size: 32px; font-weight: 600; }
.ring .lbl { font-size: 12px; color: var(--muted); }
.ring-note { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; font: inherit; color: inherit; text-align: left; border: 1px solid transparent; cursor: pointer; }
.stat:hover { border-color: var(--line); }
.stat[aria-pressed="true"] { border-color: var(--accent); }
.focus-btn { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); padding: 0 7px; font-size: 11.5px; }
.needs li { align-items: center; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20; max-width: min(640px, calc(100vw - 32px)); background: var(--panel-2); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.toast code { background: var(--bg); padding: 1px 6px; border-radius: 4px; }
.stat .n { font-size: 22px; font-weight: 600; }
.stat .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
.hero.flat .pipeline { margin-top: 0; }
.step { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.step.done { border-color: var(--pass); color: var(--pass); }
.step.now { border-color: var(--warn); color: var(--warn); }
.arrow { color: var(--idle); }

.tabgroup { display: grid; gap: 8px; }
.tabgroup + .tabgroup { margin-top: 14px; }
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.agent { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; overflow: hidden; }
.agent .row1 { display: flex; align-items: center; gap: 8px; }
.agent .role { font-weight: 600; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent .st { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; flex: none; }
.agent .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.agent .doing { overflow-wrap: anywhere; font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
.light { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); flex: none; }
.agent.working .light { background: var(--info); animation: breathe 1.4s ease-in-out infinite; }
.agent.working { border-color: color-mix(in srgb, var(--info) 45%, var(--line)); }
.agent.done .light { background: var(--pass); }
.agent.blocked .light { background: var(--fail); }
.agent.blocked, .agent.flag { border-color: var(--fail); }
@keyframes breathe { 50% { opacity: .35; transform: scale(.8); } }
.agent.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.agent .rep { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.rest { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
details.rest summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
details.rest[open] summary { margin-bottom: 10px; }
.empty-board { color: var(--muted); padding: 8px 0; }

.feed { list-style: none; margin: 0; padding: 0; display: grid; align-content: start; gap: 2px; flex: 1 1 0; min-height: 220px; max-height: 560px; overflow-y: auto; }
.feed li { display: grid; grid-template-columns: 64px 10px 1fr; gap: 10px; align-items: baseline; padding: 6px 4px; border-radius: 6px; }
.feed li.fresh { animation: flash 2.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 22%, transparent); } 100% { background: transparent; } }
.feed .t { color: var(--muted); font-size: 12px; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.items li { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
.items .what { min-width: 0; }
.items .s { color: var(--muted); font-size: 12px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.card .code { font-family: var(--font-mono); color: var(--accent); font-size: 12.5px; }
.card .name { font-weight: 600; }
.card .meta { color: var(--muted); font-size: 12px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters select, .filters input { font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.filters input { flex: 1 1 200px; min-width: 0; }
.count { margin-left: auto; color: var(--muted); font-size: 12px; }
.tablebox { overflow-x: auto; max-height: 560px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 820px; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--panel-2); }
td.note { color: var(--muted); max-width: 420px; }
.cam { color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(4, 7, 12, .7); }
.dlg-head { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.dlg-body { padding: 16px; display: grid; gap: 12px; }
.dlg-body img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
.close { font: inherit; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 12px; cursor: pointer; }

@media (max-width: 900px) { .brow { grid-template-columns: 1fr 1fr; } }
@media (max-width: 1100px) { .top-row { grid-template-columns: 1fr; } .top-row > .needs { min-height: 0; } }
@media (max-width: 760px) { .hero-main, .brow { grid-template-columns: 1fr; } .ring { margin: 0 auto; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 id="title">Squad 看板</h1>
    <div class="crumb" id="crumb"></div>
  </div>
  <div class="live" id="live"><i></i><span id="live-text">连接中…</span></div>
</header>
<div class="layout">
  <aside class="rail" aria-labelledby="h-rail">
    <div class="rail-head">
      <h2 id="h-rail">动态</h2>
      <div class="rail-kinds" id="rail-kinds" role="group" aria-label="按类型筛选动态"></div>
    </div>
    <button type="button" class="rail-new" id="rail-new" hidden></button>
    <ul class="feed" id="feed"></ul>
  </aside>
  <main class="wrap" id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head"><strong id="dlg-title"></strong><button class="close" id="dlg-close" type="button">关闭</button></div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>

<script>
const FIXED = { working: "info", idle: "idle", done: "pass", blocked: "fail", open: "fail", reopened: "fail", fixing: "warn", deployed: "info", verified: "pass",
  warn: "warn", fail: "fail", info: "info", pass: "pass", "in-progress": "info", missing: "idle", unknown: "muted" };
const STATUS_ZH = { working: "进行中", idle: "空闲", done: "完成", blocked: "等待输入" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tokenOf = (board, id) => (board && board.statuses || []).find(s => s.id === id)?.color || FIXED[id] || "muted";
const col = (board, id) => `var(--${tokenOf(board, id)})`;
const boardKey = b => b.archive ? `archive:${b.archive}` : `${b.session}/${b.id}`;
let STATE = null, view = null, firstRender = true;
const seenEvents = new Set();

function allBoards() { return (STATE?.sessions || []).flatMap(s => s.boards); }
function route() {
  const a = location.hash.match(/^#\/a\/([^?]+)(?:\?w=(.+))?$/);
  if (a) return { archive: decodeURIComponent(a[1]), worker: a[2] ? decodeURIComponent(a[2]) : "" };
  const m = location.hash.match(/^#\/b\/([^/]+)\/([^?]+)(?:\?w=(.+))?$/);
  return m ? { session: decodeURIComponent(m[1]), id: decodeURIComponent(m[2]), worker: m[3] ? decodeURIComponent(m[3]) : "" } : null;
}
const boardHref = (b, worker) => `${b.archive ? `#/a/${encodeURIComponent(b.archive)}` : `#/b/${encodeURIComponent(b.session)}/${encodeURIComponent(b.id)}`}${worker ? `?w=${encodeURIComponent(worker)}` : ""}`;
const fmtTime = ts => new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false });
const ago = ts => {
  if (!ts) return "";
  const m = Math.floor((Date.now() / 1000 - ts) / 60);
  return m < 1 ? "刚刚" : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.floor(m / 60)} 小时前` : `${Math.floor(m / 1440)} 天前`;
};
const mainline = (b, tab) => { const base = (tab || "").replace(/-\d+$/, ""); return (b.claimed || []).includes(base) ? base : tab; };
const TALLY = [["blocked", "等待输入"], ["working", "进行中"], ["done", "完成"], ["idle", "空闲"]];
const tally = (ws, showIdleBlocked = true) => TALLY.map(([s, zh]) => [s, zh, ws.filter(w => w.status === s).length]).filter(([s, , n]) => n || (showIdleBlocked && s === "blocked"))
  .map(([s, zh, n]) => `<span class="${n ? "" : "z"}"><i class="dot" style="background:var(--${n ? FIXED[s] : "idle"});border-radius:50%"></i>${n} ${zh}</span>`).join("");
const flaggedNames = b => new Set((b.needs || []).map(n => n.worker).filter(Boolean));

function counted(board) {
  const excluded = new Set((board.statuses || []).filter(s => s.exclude).map(s => s.id));
  return (board.rows || []).filter(r => !excluded.has(r.status));
}
function doneShare(board) {
  const rows = counted(board); if (!rows.length) return null;
  const done = new Set((board.statuses || []).filter(s => s.done).map(s => s.id));
  return rows.filter(r => done.has(r.status)).length / rows.length;
}
function ringStats(board) {
  const sts = board.statuses || [], rows = counted(board), ids = f => new Set(sts.filter(f).map(s => s.id));
  const done = ids(s => s.done), pass = ids(s => s.pass), na = ids(s => s.na), gone = sts.find(s => s.exclude);
  const concluded = rows.filter(r => done.has(r.status)).length;
  const excluded = (board.rows || []).length - rows.length;
  const note = `已出结论 ${concluded}/${rows.length}${excluded && gone ? ` · 另有 ${excluded} 条${gone.label}，不计入` : ""}`;
  if (!pass.size) return { pct: Math.floor(concluded / rows.length * 100) + "%", label: "已出结论", note: "" };
  const graded = rows.filter(r => !na.has(r.status)).length;
  return { pct: graded ? Math.floor(rows.filter(r => pass.has(r.status)).length / graded * 100) + "%" : "–", label: "通过率", note };
}
function barHtml(board, rows) {
  return (board.statuses || []).map(s => [s, rows.filter(r => r.status === s.id).length]).filter(([, n]) => n)
    .map(([s, n]) => `<span style="width:${n / rows.length * 100}%;background:var(--${s.color})" title="${esc(s.label)} ${n}"></span>`).join("");
}
const isUnclosed = i => !["verified", "rejected"].includes(i.status);
const openIssues = b => (b.issues || []).filter(isUnclosed).length;
const issueUrgency = i => ({ open: 0, reopened: 0, fixing: 1, deployed: 2 })[i.status] ?? 1;
let issuesOpenOnly = true;

const focusBtn = (session, pane, who) => `<button type="button" class="chip focus-btn" data-focus-session="${esc(session)}" data-focus-pane="${esc(pane)}" data-focus-who="${esc(who)}" title="在 herdr 里切到这个 pane">⤢ 定位</button>`;
const renderedHTML = new WeakMap();
const put = el => ({ set innerHTML(html) { if (renderedHTML.get(el) !== html) { renderedHTML.set(el, html); el.innerHTML = html; } } });
let pointerDown = false, renderQueued = false;
addEventListener("pointerdown", () => { pointerDown = true; }, true);
addEventListener("pointerup", () => setTimeout(() => { pointerDown = false; if (renderQueued) { renderQueued = false; render(false); } }, 0), true);
addEventListener("pointercancel", () => { pointerDown = false; }, true);
function toast(html) {
  const el = document.getElementById("toast");
  el.innerHTML = html; el.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { el.hidden = true; }, 7000);
}
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-focus-pane]");
  if (!btn) return;
  e.preventDefault();
  const { focusSession: session, focusPane: pane, focusWho: who } = btn.dataset;
  try {
    const res = await fetch("/api/focus", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session, pane }) });
    if (!res.ok) return toast(`定位失败：${esc(await res.text())}`);
    toast(`已在 session <b class="mono">${esc(session)}</b> 里切到 <b>${esc(who)}</b>。终端连的是别的 session 时，运行 <code class="mono">herdr session attach ${esc(session)}</code> 切过去。`);
  } catch { toast("定位失败：连不上看板服务"); }
});
const KIND_LABEL = { choice: "选择框", approval: "权限确认" };
function decisionCard(d) {
  const key = `${d.session}|${d.pane}`;
  return `<li class="decision" data-session="${esc(d.session)}" data-pane="${esc(d.pane)}">
    <div class="dhead"><b>${esc(d.title)}</b><span class="chip mono">${esc(d.session)}</span>${d.story ? `<span class="chip mono">${esc(d.story)}</span>` : ""}
      ${KIND_LABEL[d.kind] ? `<span class="pill" style="color:var(--warn)">${KIND_LABEL[d.kind]}</span>` : ""}<span class="s mono">${d.done_at ? `${esc(d.done_at)} 起在等` : "在等你"}</span></div>
    ${d.recap ? `<div class="recap">${esc(d.recap)}</div>` : ""}
    <div class="pre dq">${esc(d.question)}</div>
    ${(d.options || []).length ? `<ol class="dopts">${d.options.map(o => `<li><button type="button" class="dopt" data-option="${esc(o)}" title="填进回复框">${esc(o)}</button></li>`).join("")}</ol>` : ""}
    <div class="dacts">
      ${d.suggestion && d.kind === "question" ? `<button type="button" class="chip accept" data-send="${esc(d.suggestion)}">采纳建议：「${esc(d.suggestion)}」</button>` : ""}
      ${d.kind === "question" ? `<button type="button" class="chip" data-reply-open>回复…</button>` : ""}
      ${focusBtn(d.session, d.pane, d.title)}
    </div>
    <div class="dreply" ${openReplies.has(key) ? "" : "hidden"}><textarea class="reply-text" rows="2" placeholder="写给这个会话的回复，发送后它会继续" data-key="${esc(key)}">${esc(replyDrafts.get(key) || "")}</textarea>
      <button type="button" class="chip accept" data-reply-send>发送</button></div></li>`;
}
function needsBlock(decisions, needs, board, withBoardTag) {
  const head = decisions.length ? `<ul class="decisions">${decisions.map(decisionCard).join("")}</ul>` : "";
  if (!needs.length) return head || `<div class="empty">现在没有需要你处理的事。</div>`;
  const other = needsList(needs, board, withBoardTag);
  return head ? `${head}<details class="other-needs" ${otherNeedsOpen ? "open" : ""}><summary>其他提醒 · ${needs.length}</summary>${other}</details>` : other;
}
const openReplies = new Set(), replyDrafts = new Map();
let otherNeedsOpen = false;
document.addEventListener("toggle", e => { if (e.target.classList?.contains("other-needs")) otherNeedsOpen = e.target.open; }, true);
document.addEventListener("input", e => { if (e.target.classList?.contains("reply-text")) replyDrafts.set(e.target.dataset.key, e.target.value); });
document.addEventListener("focusout", e => { if (e.target.classList?.contains("reply-text") && renderQueued) setTimeout(() => { renderQueued = false; render(false); }, 0); });
async function sendReply(card, text, button) {
  const { session, pane } = card.dataset;
  button.disabled = true;
  try {
    const res = await fetch("/api/reply", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session, pane, text }) });
    const data = await res.json().catch(() => ({ message: "发送失败" }));
    toast(res.ok ? `已发给 <b>${esc(card.querySelector(".dhead b").textContent)}</b>：${esc(text.slice(0, 60))}` : `没有发送：${esc(data.message)}`);
    if (res.ok) { const key = `${session}|${pane}`; replyDrafts.delete(key); openReplies.delete(key); }
  } catch { toast("没有发送：连不上看板服务"); }
  button.disabled = false;
}
document.addEventListener("click", e => {
  const card = e.target.closest("li.decision"); if (!card) return;
  const key = `${card.dataset.session}|${card.dataset.pane}`, area = card.querySelector(".reply-text");
  if (e.target.closest("[data-reply-open]")) { openReplies.add(key); card.querySelector(".dreply").hidden = false; area.focus(); }
  else if (e.target.closest("[data-option]")) { openReplies.add(key); card.querySelector(".dreply").hidden = false; area.value = e.target.closest("[data-option]").dataset.option; replyDrafts.set(key, area.value); area.focus(); }
  else if (e.target.closest("[data-send]")) sendReply(card, e.target.closest("[data-send]").dataset.send, e.target.closest("[data-send]"));
  else if (e.target.closest("[data-reply-send]")) { const text = area.value.trim(); if (text) sendReply(card, text, e.target.closest("[data-reply-send]")); else area.focus(); }
});

function needsList(items, board, withBoardTag) {
  const sorted = [...items].sort((a, b) => (a.level !== "fail") - (b.level !== "fail"));
  return sorted.length ? `<ul>${sorted.map(n => { const b = n.board || board; return `<li><a class="go" href="${boardHref(b, n.worker)}">
      <i class="dot" style="background:var(--${FIXED[n.level]})"></i>${withBoardTag ? `<span class="tag mono">${esc(b.name)}</span>` : ""}<span>${esc(n.text)}</span>
      <span class="where mono">${esc([n.tab ? mainline(b, n.tab) : "", n.worker].filter(Boolean).join(" › "))}</span></a>${n.pane && !b.archived ? focusBtn(b.session, n.pane, n.worker || "无名 agent") : ""}</li>`; }).join("")}</ul>`
    : `<div class="empty">现在没有需要你处理的事。</div>`;
}
const boardRank = b => b.offline ? 4 : (b.needs || []).length ? 0 : (b.workers || []).some(w => w.status === "working") ? 1 : (b.workers || []).length ? 2 : 3;

function loadSet(key) { try { return new Set(JSON.parse(localStorage.getItem(key) || "[]")); } catch { return new Set(); } }
function saveSet(key, set) { try { localStorage.setItem(key, JSON.stringify([...set])); } catch {} }
const SUB_KEY = "squad-board.subscribed", SEEN_KEY = "squad-board.seen";
const subs = loadSet(SUB_KEY), seen = loadSet(SEEN_KEY), firstVisit = !seen.size;
let catalogOpen = null;
const wildcard = session => `${session}/*`;
const isSubscribed = b => subs.has(boardKey(b)) || subs.has(wildcard(b.session));
const isDecisionSubscribed = d => subs.has(wildcard(d.session)) || subs.has(`${d.session}/${d.board}`);

function unsubscribe(b) {
  if (subs.has(boardKey(b))) subs.delete(boardKey(b));
  else if (subs.has(wildcard(b.session))) {
    subs.delete(wildcard(b.session));
    allBoards().filter(x => x.session === b.session && boardKey(x) !== boardKey(b)).forEach(x => subs.add(boardKey(x)));
  }
}

function archiveList() {
  const list = STATE.archives || [];
  if (!list.length) return "";
  return `<details class="panel archives" ${archivesOpen ? "open" : ""}><summary><h2 style="display:inline">已归档 · ${list.length}</h2></summary>
    <div class="cat-list">${list.map(a => `<div class="cat-item"><a class="name" href="#/a/${encodeURIComponent(a.archive)}">${esc(a.name)}</a>
      <span class="sub mono">${esc(a.session)} · 归档于 ${esc(fmtTime(a.archived_at))}${a.graded ? ` · 通过率 ${Math.floor(a.passed / a.graded * 100)}%` : ""}${a.tasks ? ` · Task ${a.tasks_done}/${a.tasks}` : ""}${a.demos ? ` · ▶ ${a.demos} 演示` : ""}${a.closed_out ? " · ✅ 已收尾" : ""} · ${a.workers} worker</span>
      <button type="button" class="chip sub" data-restore="${esc(a.archive)}">恢复</button></div>`).join("")}</div></details>`;
}
let archivesOpen = false;
document.addEventListener("toggle", e => { if (e.target.classList?.contains("archives")) archivesOpen = e.target.open; }, true);

function renderOverview() {
  document.getElementById("title").textContent = "Squad 看板";
  const sessions = STATE.sessions, boards = allBoards(), mine = boards.filter(isSubscribed), others = boards.filter(b => !isSubscribed(b));
  const myDecisions = (STATE.decisions || []).filter(isDecisionSubscribed);
  const fresh = new Set(firstVisit ? [] : boards.map(boardKey).filter(k => !seen.has(k)));
  boards.forEach(b => seen.add(boardKey(b))); saveSet(SEEN_KEY, seen);
  put(document.getElementById("crumb")).innerHTML = `订阅 ${mine.length} / 共 ${boards.length} 个看板 · ${sessions.length} 个 herdr session`;
  const needs = mine.flatMap(b => (b.needs || []).map(n => ({ ...n, board: b })));
  const otherNeeds = others.reduce((n, b) => n + (b.needs || []).length, 0);
  const subBtn = (attr, key, text) => `<button type="button" class="chip sub" ${attr}="${esc(key)}">${text}</button>`;
  const row = b => {
    const off = subBtn("data-unsub", boardKey(b), "取消订阅");
    if (b.offline) return `<div class="bwrap"><div class="brow compact offline"><div><div class="name">${esc(b.name)}</div><div class="sub">session 未运行</div></div></div>${off}</div>`;
    const ws = b.workers || [], share = doneShare(b), rows = counted(b), last = (b.events || [])[0];
    const lines = [...new Set((b.tabs.length ? b.tabs : b.claimed).map(t => mainline(b, t)))];
    const autoTag = b.auto ? ` <span class="chip" title="${esc(b.subtitle)}">未登记</span>` : "";
    if (!ws.length && share === null) return `<div class="bwrap"><a class="brow compact" href="${boardHref(b)}">
      <div><div class="name">${esc(b.name)}${autoTag}</div><div class="sub">${esc(b.subtitle)}</div></div>
      <div class="sub">认领 ${b.claimed.map(t => `<span class="chip mono">${esc(t)}</span>`).join(" ")} · 还没有 worker</div></a>${off}</div>`;
    return `<div class="bwrap"><a class="brow ${(b.needs || []).length ? "attn" : ""}" href="${boardHref(b)}">
      <div><div class="name">${esc(b.name)}${autoTag}</div><div class="sub">${esc(b.subtitle)}</div>
        <div class="tabs">${lines.map(t => `<span class="chip mono">${esc(t)}</span>`).join("")}</div></div>
      <div><div class="tally">${tally(ws)}</div><div class="counts mono">${ws.length} worker${(b.needs || []).length ? ` · <span style="color:var(--fail)">${b.needs.length} 项需要你</span>` : ""}</div></div>
      <div>${share === null ? `<div class="sub">${Object.keys(b.cards || {}).length ? `${Object.keys(b.cards).length} 张卡 · 未配置 AC 数据源` : "未配置 AC 数据源"}</div>`
        : `<div class="bar">${barHtml(b, rows)}</div><div class="counts mono">${(r => `${r.pct} ${r.label}${r.note ? ` · ${r.note.split(" · ")[0]}` : ""}`)(ringStats(b))} · ${Object.keys(b.cards || {}).length} 张卡 · ${rows.length} 条 AC</div>`}
        ${b.auto ? "" : `<div class="counts mono">缺陷未关 ${openIssues(b)} · 待确认 ${(b.pending || []).length}${implTotals(b).total ? ` · 实现 ${implTotals(b).done}/${implTotals(b).total} Task` : ""}${(b.demos || []).length ? ` · ▶ ${b.demos.length} 演示` : ""}${b.closeout?.state === "done" ? " · ✅ 已收尾" : ""}</div>`}</div>
      <div class="last">${last ? `<span class="mono">${esc(ago(last.ts) || last.at)}</span> · ${esc(last.text)}` : "还没有动态"}</div></a>${off}</div>`;
  };
  const mySessions = sessions.map(s => ({ s, bs: s.boards.filter(isSubscribed) })).filter(x => x.bs.length);
  const catalogSessions = sessions.map(s => ({ s, bs: s.boards.filter(b => !isSubscribed(b)) })).filter(x => x.bs.length);
  const open = catalogOpen ?? (!mine.length || fresh.size > 0);
  const catalog = catalogSessions.length ? `<details class="panel catalog" id="catalog" ${open ? "open" : ""}>
      <summary><h2 style="display:inline">可订阅 · ${others.length} 个看板</h2>${otherNeeds ? ` <span style="color:var(--warn);font-size:12.5px">其中 ${otherNeeds} 项需要你</span>` : ""}${fresh.size ? ` <span class="chip new">${fresh.size} 个新出现</span>` : ""}</summary>
      ${catalogSessions.map(({ s, bs }) => `<div class="cat-session"><div class="session-head"><b>${esc(s.name)}</b>${subBtn("data-sub", wildcard(s.name), "订阅整个 session（含以后的新看板）")}</div>
        <div class="cat-list">${bs.map(b => `<div class="cat-item"><span class="name">${esc(b.name)}</span>${b.auto ? ` <span class="chip">未登记</span>` : ""}${fresh.has(boardKey(b)) ? ` <span class="chip new">新</span>` : ""}
          <span class="sub">${b.offline ? "session 未运行" : `${(b.workers || []).length} worker`}${(b.needs || []).length ? ` · <span style="color:var(--fail)">${b.needs.length} 项需要你</span>` : ""}</span>${subBtn("data-sub", boardKey(b), "订阅")}</div>`).join("")}</div></div>`).join("")}
    </details>` : "";
  put(document.getElementById("app")).innerHTML = mine.length ? `
    <div class="top-row"><section class="panel needs" aria-labelledby="h-needs"><h2 id="h-needs">需要你${myDecisions.length ? ` · ${myDecisions.length} 个会话在等你决定` : ""}</h2>${needsBlock(myDecisions, needs, null, true)}</section><div class="panel rail-box" id="rail-slot"></div></div>
    ${mySessions.map(({ s, bs }) => `<section class="session" aria-label="session ${esc(s.name)}">
      <div class="session-head"><h2 style="margin:0">session</h2><b>${esc(s.name)}</b><span class="muted" style="font-size:12px">${subs.has(wildcard(s.name)) ? "整个 session 已订阅（含新看板）" : `订阅了 ${bs.length} / ${s.boards.length} 个看板`}</span>
        ${subs.has(wildcard(s.name)) ? subBtn("data-unsub-session", s.name, "取消订阅 session") : ""}</div>
      ${[...bs].sort((a, b) => boardRank(a) - boardRank(b)).map(row).join("")}</section>`).join("")}
    ${catalog}${archiveList()}` : `<section class="panel"><h2>还没有订阅任何看板</h2><div class="muted">在下面选择要看的看板，或者订阅整个 session。只有订阅的看板会出现在总览和「需要你」里。</div></section>${catalog}${archiveList()}`;
  document.getElementById("catalog")?.addEventListener("toggle", e => { catalogOpen = e.target.open; });
}
function toggleSubscription(b) { isSubscribed(b) ? unsubscribe(b) : subs.add(boardKey(b)); saveSet(SUB_KEY, subs); }
document.addEventListener("click", e => {
  const sub = e.target.closest("[data-sub]"), unsub = e.target.closest("[data-unsub]"), unsubSession = e.target.closest("[data-unsub-session]"), here = e.target.closest("[data-sub-here]");
  if (!sub && !unsub && !unsubSession && !here) return;
  e.preventDefault();
  if (sub) subs.add(sub.dataset.sub);
  if (unsub) { const b = allBoards().find(x => boardKey(x) === unsub.dataset.unsub); if (b) unsubscribe(b); }
  if (unsubSession) { const name = unsubSession.dataset.unsubSession; subs.delete(wildcard(name)); [...subs].filter(k => k.startsWith(`${name}/`)).forEach(k => subs.delete(k)); }
  if (here) { const b = current(); if (b) toggleSubscription(b); }
  if (!here) saveSet(SUB_KEY, subs);
  render(false);
});

const filters = { card: "", q: "", group: "", active: new Set() };
const fileHref = (b, rel) => `/files/${encodeURIComponent(b.session)}/${encodeURIComponent(b.id)}/${rel.split("/").map(encodeURIComponent).join("/")}`;
const fileLink = (b, rel, text) => rel ? `<a class="flink mono" href="${fileHref(b, rel)}" target="_blank" rel="noopener" title="${esc(rel)}">${esc(text)}</a>` : `<span class="mono">${esc(text)}</span>`;

function jumpToTable() {
  const b = current(); if (!b) return;
  const fCard = document.getElementById("f-card"), fq = document.getElementById("f-q");
  if (fCard) fCard.value = filters.card;
  if (fq) fq.value = filters.q;
  renderCards(b); renderTable(b);
  document.getElementById("h-table")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function openIssue(b, id) {
  let i = (b.issues || []).find(x => x.id === id); if (!i) return;
  if (!b.archived && !("repro" in i)) {
    const res = await fetch(`/api/issue?board=${encodeURIComponent(`${b.session}/${b.id}`)}&id=${encodeURIComponent(id)}`);
    if (res.ok) i = await res.json();
  }
  document.getElementById("dlg-title").textContent = `${i.id} · ${i.title || ""}`;
  const block = (k, v) => v ? `<section><div class="dlg-k">${k}</div><div class="pre">${esc(v)}</div></section>` : "";
  const acs = (i.acs || []).map(a => { const m = String(a).match(/^(\d{5})\s+([A-Z]+-?\d+[a-z]?)/);
    return m && (b.rows || []).some(r => r.card === m[1] && r.ac === m[2]) ? `<button type="button" class="chip" data-ac-jump="${esc(m[1])}|${esc(m[2])}" title="在 AC 表里定位">${esc(a)}</button>` : `<span class="chip">${esc(a)}</span>`; }).join(" ");
  const facts = [["状态", i.status], ["严重程度", i.severity], ["归因", i.cause], ["组", i.group], ["轮次", i.round && `第 ${i.round} 轮`], ["PR", i.pr], ["CI", i.ci]].filter(([, v]) => v)
    .map(([k, v]) => `<span class="pill" style="color:${k === "状态" ? col(b, v) : "var(--muted)"}">${esc(k)} ${esc(v)}</span>`).join(" ");
  const notes = Object.entries(i.notes || {});
  document.getElementById("dlg-body").innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:6px">${facts}</div>
    ${acs ? `<section><div class="dlg-k">关联 AC</div><div style="display:flex;flex-wrap:wrap;gap:6px">${acs}</div></section>` : ""}
    ${block("复现", i.repro)}${block("期望", i.expected)}${block("实际", i.actual)}
    ${notes.length ? `<details><summary class="dlg-k" style="cursor:pointer">其他记录（${notes.length}）</summary>${notes.map(([k, v]) => block(k, v)).join("")}</details>` : ""}
    ${(i.evidence || []).map(s => `<figure style="margin:0"><figcaption class="mono muted" style="font-size:12px;margin-bottom:4px">${esc(s)}</figcaption><img loading="lazy" src="${fileHref(b, s)}" alt="${esc(i.id)} 证据截图"></figure>`).join("")}
    ${i.file ? `<div class="s">原始记录：${fileLink(b, i.file, i.file.split("/").pop())}</div>` : ""}`;
  dlg.showModal();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-card], [data-group], [data-issue], [data-ac-jump], [data-clear-group]");
  if (!t || e.target.closest("a")) return;
  const b = current(); if (!b) return;
  if (t.dataset.card !== undefined) { filters.card = filters.card === t.dataset.card ? "" : t.dataset.card; return jumpToTable(); }
  if (t.dataset.group !== undefined) { filters.group = filters.group === t.dataset.group ? "" : t.dataset.group; return jumpToTable(); }
  if (t.dataset.clearGroup !== undefined) { filters.group = ""; return jumpToTable(); }
  if (t.dataset.issue !== undefined) return openIssue(b, t.dataset.issue);
  const [card, ac] = t.dataset.acJump.split("|");
  filters.card = card; filters.q = ac; filters.group = ""; filters.active.clear();
  dlg.close(); jumpToTable();
});
document.addEventListener("keydown", e => {
  const row = e.key === "Enter" && e.target.closest("[data-issue]");
  if (row && current()) openIssue(current(), row.dataset.issue);
});
const openRest = new Set();
let scrollToFocus = false;
let shown = [];

}

const workItemsOnly = b => (b.plans || []).length > 0 && b.plans.every(p => p.kind === "workitem");
function implTotals(b) {
  const tracked = (b.plans || []).filter(p => p.tracked);
  return { done: tracked.reduce((n, p) => n + p.done, 0), total: tracked.reduce((n, p) => n + p.tasks, 0) };
}
const progressState = (done, total) => total && done === total ? "done" : done ? "now" : "";
const phaseView = b => p => {
  if (p.auto === "impl") { const { done, total } = implTotals(b); return { label: `${p.label} ${done}/${total} ${workItemsOnly(b) ? "项" : "Task"}`, state: progressState(done, total) }; }
  if (p.auto === "closeout") { const c = b.closeout; return { label: p.label, state: c?.state === "done" ? "done" : c?.exists ? "now" : "" }; }
  if (p.auto === "plans") { const ps = b.plans || [], done = ps.filter(x => x.state === "done").length; return { label: `${p.label} ${done}/${ps.length}`, state: progressState(done, ps.length) }; }
  return p;
};
const openPlans = new Set();
const EVENT_TARGET = { worker: "worker", report: "worker", ac: "AC", issue: "缺陷", plan: "子计划", closeout: "收尾" };
const eventRef = e => e.worker || (e.card && e.ac ? `${e.card}|${e.ac}` : "") || e.issue || e.plan || (e.closeout ? "closeout" : "");
let pendingEvent = null;
function runEvent(b, kind, ref) {
  if (kind === "worker" || kind === "report") {
    if (route()?.worker !== ref) { location.hash = boardHref(b, ref); return; }
    document.querySelector(`.agent[data-w="${CSS.escape(ref)}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
  } else if (kind === "ac") {
    const [card, ac] = ref.split("|"), row = (b.rows || []).find(r => r.card === card && r.ac === ac);
    if (row) openAc(b, row);
  } else if (kind === "issue") {
    openIssue(b, ref);
  } else if (kind === "closeout") {
    document.getElementById("closeout-sec")?.scrollIntoView({ behavior: "smooth", block: "center" });
  } else if (kind === "plan") {
    const key = `${boardKey(b)}|${ref}`;
    openPlans.add(key); renderSide(b);
    document.querySelector(`details[data-plan="${CSS.escape(key)}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}
function planItem(b, p) {
  const share = p.tasks ? p.done / p.tasks : 0, key = `${boardKey(b)}|${p.id}`;
  const impl = p.impl ? `<span class="pill" style="color:var(--${p.impl.state === "done" ? "pass" : p.impl.state === "blocked" ? "fail" : "info"})" title="${esc(p.impl.detail)}">实现 ${esc(p.impl.state)}</span>` : "";
  const planPill = `<span class="pill" style="color:${col(b, p.state === "done" ? "done" : p.state)}">计划 ${p.state === "done" ? "已完成" : esc(p.state)}</span>`;
  const labels = [...new Set(p.task_list.map(t => t.part))];
  const rows = labels.map(label => `${label && labels.length > 1 ? `<li class="task-part mono">${esc(label)}</li>` : ""}${p.task_list.filter(t => t.part === label).map(t => `<li class="task ${t.done ? "done" : ""}">
      <span class="mark">${t.done ? (t.note.startsWith("跳过") ? "–" : "✔") : "○"}</span><span class="mono tid">${esc(t.id)}</span>
      <span class="ttl">${esc(t.title)}${t.note ? `<span class="tnote" title="${esc(t.note)}">${esc(t.note)}</span>` : ""}</span><span class="mono sha">${esc(t.sha.slice(0, 10))}</span></li>`).join("")}`).join("");
  return `<li class="plan"><details data-plan="${esc(key)}" ${openPlans.has(key) ? "open" : ""}><summary>
      <div class="what"><b class="mono">${esc(p.id)}</b> <span class="s">${esc(p.repo)} · ${esc(p.scope)}</span>
        ${p.kind === "workitem" ? "" : p.tracked ? `<div class="pbar"><span style="width:${share * 100}%"></span></div><div class="s mono">实现 ${p.done}/${p.tasks} Task</div>` : p.tasks ? `<div class="s mono">${p.tasks} Task · 未配置进度文件</div>` : ""}</div>
      <span class="pills">${demoBadge(b, p.id)}${p.kind === "workitem" ? "" : planPill}${impl}</span></summary>
      <div class="plan-files s">${(p.files || []).map(f => `${f.label && (p.files || []).length > 1 ? `<b class="mono">${esc(f.label)}</b> ` : ""}计划 ${f.plan.map(x => fileLink(b, x, x.split("/").pop())).join("、") || "—"} · 进度 ${f.progress.map(x => fileLink(b, x, x.split("/").pop())).join("、") || "未配置"}`).join("<br>")}</div>
      ${p.task_list.length ? `<ul class="tasks">${rows}</ul>` : `<div class="s">计划里没有 ### Task 段落。</div>`}</details></li>`;
}

function renderHero(b) {
  const rows = counted(b), share = doneShare(b);
  const phases = (b.phases || []).map(phaseView(b)).map((p, i) => `${i ? '<span class="arrow">→</span>' : ""}<span class="step ${esc(p.state)}">${esc(p.label)}</span>`).join("");
  const bare = share === null && !phases;
  document.getElementById("hero").hidden = bare;
  document.getElementById("top-row").classList.toggle("bare", bare);
  if (share === null) {
    put(document.getElementById("hero-main")).innerHTML = phases ? `<div class="pipeline">${phases}</div>` : "";
    return;
  }
  const C = 2 * Math.PI * 52, ring = ringStats(b); let off = 0;
  const segs = (b.statuses || []).filter(s => s.done).map(s => [s, rows.filter(r => r.status === s.id).length]).filter(([, n]) => n).map(([s, n]) => {
    const len = n / rows.length * C; const seg = `<circle cx="60" cy="60" r="52" fill="none" stroke="var(--${s.color})" stroke-width="12" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"/>`; off += len; return seg;
  }).join("");
  const tiles = (b.statuses || []).filter(s => !s.exclude).map(s => [s, rows.filter(r => r.status === s.id).length]).filter(([, n]) => n)
    .map(([s, n]) => `<button type="button" class="stat" data-stat="${esc(s.id)}" aria-pressed="${filters.active.size === 1 && filters.active.has(s.id)}" title="只看「${esc(s.label)}」的 AC"><div class="n mono">${n}</div><div class="k"><i class="dot" style="background:var(--${s.color})"></i>${esc(s.label)}</div></button>`).join("")
    + `<button type="button" class="stat" data-stat-issues aria-pressed="${issuesOpenOnly}" title="缺陷列表只看未关闭的"><div class="n mono">${openIssues(b)}</div><div class="k"><i class="dot" style="background:var(--fail)"></i>未关闭缺陷</div></button>`;
  put(document.getElementById("hero-main")).innerHTML = `<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--panel-2)" stroke-width="12"/>${segs}</svg>
    <div class="center"><span class="pct mono">${ring.pct}</span><span class="lbl">${ring.label}</span></div></div>
    <div>${ring.note ? `<div class="ring-note mono">${esc(ring.note)}</div>` : ""}<div class="stats">${tiles}</div>${phases ? `<div class="pipeline">${phases}</div>` : ""}</div>`;
}

function renderAgents(b) {
  const box = document.getElementById("agents");
  if (!(b.workers || []).length && !(b.missing || []).length && b.auto) {
    put(box).innerHTML = `<div class="panel empty-board">这个 story 目前没有 worker 在跑（lead 自己做的，或已收工）。</div>`;
    return;
  }
  if (!(b.workers || []).length && !(b.missing || []).length) {
    put(box).innerHTML = `<div class="panel empty-board">认领了 ${b.claimed.map(t => `<span class="chip mono">${esc(t)}</span>`).join(" ")}，但 herdr 里还没有这些 tab。lead 开出 W· tab 并起 worker 后，这里会自动出现。</div>`;
    return;
  }
  const rows = counted(b), flagged = flaggedNames(b), focus = route()?.worker || "";
  const doneIds = new Set((b.statuses || []).filter(s => s.done).map(s => s.id));
  const byLine = {};
  (b.workers || []).forEach(w => (byLine[mainline(b, w.tab)] ||= []).push(w));
  const loud = w => w.status === "working" || w.status === "blocked" || !w.name || flagged.has(w.name) || w.name === focus;
  const card = w => {
    const mine = w.group ? rows.filter(r => r.group === w.group) : [];
    const rep = w.report;
    return `<div class="agent ${esc(w.status)} ${flagged.has(w.name) || !w.name ? "flag" : ""} ${w.name && w.name === focus ? "focus" : ""}" data-w="${esc(w.name)}">
      <div class="row1"><span class="light"></span><span class="role">${esc(w.role)}</span><span class="st">${esc(STATUS_ZH[w.status] || w.status)}</span></div>
      <div class="meta">${w.pane && !b.archived ? focusBtn(b.session, w.pane, w.role) : ""}<span class="mono">${esc(w.name || "无名")}</span>${w.tab !== mainline(b, w.tab) ? `<span class="mono">· ${esc(w.tab.slice(mainline(b, w.tab).length))}</span>` : ""}
        ${mine.length ? `<button type="button" class="chip ac-group mono" data-group="${esc(w.group)}" title="AC 表只看 ${esc(w.group)} 组">AC ${mine.filter(r => doneIds.has(r.status)).length}/${mine.length}</button>` : ""}</div>
      ${w.task ? `<div class="rep" title="${esc(w.task.brief)}">任务 ${fileLink(b, w.task.brief_href, w.task.brief.split("/").pop() || "—")} · 派于 ${esc(ago(w.task.at))}</div>`
        : w.name ? `<div class="rep">未登记任务</div>` : ""}
      ${rep ? `<div class="rep" title="${esc(rep.file)}：${esc(rep.detail)}">报告 ${rep.stale ? `<b style="color:var(--warn)">未更新</b>` : `<b style="color:var(--${FIXED[rep.state] || "muted"})">${esc(rep.state)}</b>`} · ${fileLink(b, w.task?.report_href, rep.file.split("/").pop())} · ${esc(ago(rep.mtime))}</div>`
        : w.task && w.task.report ? `<div class="rep">报告 <span class="mono">${esc(w.task.report.split("/").pop())}</span> 还没写首行 STATUS</div>` : ""}
      <div class="doing">${esc(w.doing || "—")}</div></div>`;
  };
  put(box).innerHTML = Object.entries(byLine).sort().map(([line, ws]) => {
    const front = ws.filter(loud), rest = ws.filter(w => !loud(w)), key = `${boardKey(b)}|${line}`;
    return `<div class="tabgroup"><h3 class="mono">${esc(line)} <span class="muted" style="font-weight:400">· ${ws.length} worker</span></h3>
      ${front.length ? `<div class="agents">${front.map(card).join("")}</div>` : ""}
      ${rest.length ? `<details class="rest" data-rest="${esc(key)}" ${openRest.has(key) ? "open" : ""}><summary><span class="tally" style="display:inline-flex">${tally(rest, false)}</span> · 展开</summary><div class="agents">${rest.map(card).join("")}</div></details>` : ""}</div>`;
  }).join("")
    + ((b.missing || []).length ? `<div class="tabgroup"><h3>不在 herdr 里</h3><div class="agents">${b.missing.map(m => `<div class="agent flag"><div class="row1"><span class="light"></span><span class="role">${esc(m.role)}</span><span class="st">消失</span></div><div class="meta mono">${esc(m.name)}</div></div>`).join("")}</div></div>` : "");
}

const KINDS = [["all", "全部"], ["worker", "worker"], ["report", "报告"], ["ac", "AC"], ["issue", "缺陷"], ["plan", "子计划"], ["closeout", "收尾"]];
const GROUP_LABEL = { worker: "个 worker 状态变化", report: "份报告变化", ac: "条 AC 变化", issue: "个缺陷变化", plan: "个子计划变化" };

function railEvents() {
  const b = current();
  if (b) return (b.events || []).map(e => ({ ...e, b }));
  return allBoards().filter(isSubscribed).flatMap(x => (x.events || []).map(e => ({ ...e, b: x, tagged: true })))
    .sort((p, q) => (q.ts || 0) - (p.ts || 0)).slice(0, 150);
}

function renderRail() {
  const b = current(), all = railEvents(), present = new Set(all.map(e => e.kind));
  if (railKind !== "all" && !present.has(railKind)) railKind = "all";
  railPart("h-rail").textContent = b ? "动态" : "动态 · 已订阅的看板";
  put(railPart("rail-kinds")).innerHTML = KINDS.filter(([k]) => k === "all" || present.has(k))
    .map(([k, label]) => `<button type="button" class="chip" data-kind="${k}" aria-pressed="${railKind === k}">${label}${k === "all" ? "" : ` <span class="mono">${all.filter(e => e.kind === k).length}</span>`}</button>`).join("");
  const list = all.filter(e => railKind === "all" || e.kind === railKind);
  let freshCount = 0;
  const line = e => {
    const key = boardKey(e.b) + e.at + e.text, fresh = !firstRender && !seenEvents.has(key);
    if (fresh) freshCount++;
    seenEvents.add(key);
    const ref = eventRef(e);
    return `<li class="${fresh ? "fresh" : ""}${ref ? " evlink" : ""}"${ref ? ` data-ev-board="${esc(boardKey(e.b))}" data-ev-kind="${esc(e.kind)}" data-ev-ref="${esc(ref)}" title="跳到对应的${esc(EVENT_TARGET[e.kind] || "对象")}"` : ""}><span class="t mono">${esc(e.at)}</span><i class="dot" style="background:${col(e.b, e.color)}"></i><span>${e.tagged ? `<span class="tag mono">${esc(e.b.name)}</span> ` : ""}${esc(e.text)}</span></li>`;
  };
  const out = [];
  for (let i = 0; i < list.length; i++) {
    let j = i;
    while (j + 1 < list.length && list[j + 1].at === list[i].at && list[j + 1].kind === list[i].kind && list[j + 1].b === list[i].b) j++;
    const group = list.slice(i, j + 1), head = group[0], gkey = `${boardKey(head.b)}|${head.at}|${head.kind}`;
    out.push(group.length < 3 ? group.map(line).join("") : `<li class="grp"><details data-g="${esc(gkey)}" ${openGroups.has(gkey) ? "open" : ""}>
      <summary><span class="t mono">${esc(head.at)}</span><i class="dot" style="background:${col(head.b, head.color)}"></i><span>${head.tagged ? `<span class="tag mono">${esc(head.b.name)}</span> ` : ""}${group.length} ${GROUP_LABEL[head.kind] || "条变化"}</span></summary>
      <ul class="feed sub">${group.map(line).join("")}</ul></details></li>`);
    i = j;
  }
  const feed = railPart("feed"), atTop = feed.scrollTop < 30;
  put(feed).innerHTML = out.join("") || `<li class="empty-feed">还没有变化。worker 状态、报告 STATUS、AC 结论、缺陷状态的每次变化都会出现在这里。</li>`;
  if (!freshCount) return;
  if (atTop && !railHover) feed.scrollTo({ top: 0, behavior: "smooth" });
  else { railPending += freshCount; showRailNew(); }
}
function showRailNew() {
  const pill = railPart("rail-new");
  pill.hidden = !railPending; pill.textContent = `↑ ${railPending} 条新动态`;
}
(() => {
  const feed = railPart("feed");
  feed.addEventListener("mouseenter", () => { railHover = true; });
  feed.addEventListener("mouseleave", () => { railHover = false; });
  feed.addEventListener("scroll", () => { if (feed.scrollTop < 30 && railPending) { railPending = 0; showRailNew(); } });
  feed.addEventListener("click", e => {
    const el = e.target.closest("[data-ev-kind]");
    if (!el || e.target.closest("summary")) return;
    const { evBoard, evKind, evRef } = el.dataset, b = current() && boardKey(current()) === evBoard ? current() : allBoards().find(x => boardKey(x) === evBoard && !x.offline);
    if (!b) return;
    if (current() && boardKey(current()) === evBoard) return runEvent(b, evKind, evRef);
    if (evKind !== "worker" && evKind !== "report") pendingEvent = { board: evBoard, kind: evKind, ref: evRef };
    location.hash = boardHref(b, evKind === "worker" || evKind === "report" ? evRef : "");
  });
  feed.addEventListener("toggle", e => { const k = e.target.dataset?.g; if (k) e.target.open ? openGroups.add(k) : openGroups.delete(k); }, true);
  railPart("rail-new").addEventListener("click", () => { railPending = 0; showRailNew(); feed.scrollTo({ top: 0, behavior: "smooth" }); });
  railPart("rail-kinds").addEventListener("click", e => {
    const chip = e.target.closest("[data-kind]"); if (!chip) return;
    railKind = chip.dataset.kind; renderRail(); feed.scrollTop = 0;
  });
})();

function renderSide(b) {
  const list = (items, empty) => items.length ? items.join("") : `<li class="s">${empty}</li>`;
  const parts = [];
  if ((b.pending || []).length) parts.push(`<section class="panel" aria-label="等你确认"><h2>等你确认</h2><ul class="items">${list(b.pending.map(p => `<li><div class="what"><b class="mono">${esc(p.id)}</b> · ${esc(p.ac)}<div class="s">${esc(p.ask)}</div></div></li>`), "")}</ul></section>`);
  const unclosed = (b.issues || []).filter(isUnclosed).sort((x, y) => issueUrgency(x) - issueUrgency(y)), shownIssues = issuesOpenOnly ? unclosed : [...unclosed, ...(b.issues || []).filter(i => !isUnclosed(i))];
  if ((b.issues || []).length) parts.push(`<section class="panel" aria-label="缺陷与修复" id="issues-panel"><div class="panel-head"><h2>缺陷与修复</h2>
    <div class="filters" role="group" aria-label="缺陷筛选"><button type="button" class="chip" data-issues-filter="all" aria-pressed="${!issuesOpenOnly}">全部 <span class="mono">${b.issues.length}</span></button><button type="button" class="chip" data-issues-filter="open" aria-pressed="${issuesOpenOnly}">未关闭 <span class="mono">${unclosed.length}</span></button></div></div>
    <ul class="items">${list(shownIssues.map(i => `<li class="issue-row ${isUnclosed(i) ? "" : "closed"}" data-issue="${esc(i.id)}" tabindex="0" role="button" title="查看复现、期望、实际与证据"><div class="what"><b class="mono">${esc(i.id)}</b> ${esc(i.title)}<div class="s">${esc((i.acs || []).join("、"))} · ${esc(i.cause)} · 第 ${esc(i.round)} 轮${i.pr ? ` · PR ${esc(i.pr)}` : ""}${i.ci ? ` · CI ${esc(i.ci)}` : ""}</div></div><span class="pill" style="color:${col(b, i.status)}">${esc(i.status)}</span></li>`), "没有未关闭的缺陷")}</ul></section>`);
  if ((b.plans || []).length) { const { done, total } = implTotals(b); parts.push(`<section class="panel plans-panel" aria-label="子计划与开发进度" id="plans-panel"><h2>${workItemsOnly(b) ? "工作项" : "子计划"} · 开发进度${total ? ` <span class="mono" style="color:var(--accent)">${done}/${total} ${workItemsOnly(b) ? "项" : "Task"}</span>` : ""}</h2><ul class="items">${b.plans.map(p => planItem(b, p)).join("")}</ul></section>`); }
  const side = document.getElementById("side");
  if (!side.dataset.wired) { side.dataset.wired = "1";
    side.addEventListener("click", e => { const f = e.target.closest("[data-issues-filter]"); if (!f) return; issuesOpenOnly = f.dataset.issuesFilter === "open"; const b = current(); renderHero(b); renderSide(b); }); side.addEventListener("toggle", e => { const k = e.target.dataset?.plan; if (k) e.target.open ? openPlans.add(k) : openPlans.delete(k); }, true); }
  put(side).innerHTML = parts.join(""); side.hidden = !parts.length;
}

const fmtClock = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
document.addEventListener("click", e => {
  const c = e.target.closest("[data-seek]"); if (!c) return;
  const v = c.closest("figure.demo")?.querySelector("video"); if (!v) return;
  v.currentTime = Number(c.dataset.seek); v.play().catch(() => {});
});
const fmtSize = n => n >= 1 << 20 ? `${(n / (1 << 20)).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;
const demosFor = (b, tag) => (b.demos || []).filter(d => d.tags.includes(tag));
const demoBadge = (b, tag) => demosFor(b, tag).length ? `<span class="demo-badge" data-demo-tag="${esc(tag)}" role="button" tabindex="0" title="播放 ${esc(tag)} 的演示">▶ 演示 ${demosFor(b, tag).length}</span>` : "";
const demoFigure = (b, d, autoplay) => `<figure class="demo"><video controls preload="metadata" ${autoplay ? "autoplay" : ""} src="${fileHref(b, d.file)}">${d.subtitles ? `<track kind="subtitles" srclang="zh" label="讲解" default src="${fileHref(b, d.subtitles)}">` : ""}</video>
  <figcaption><b>${esc(d.title)}</b>${d.tags.map(t => ` <span class="chip mono">${esc(t)}</span>`).join("")}<span class="s mono">${esc(fmtTime(d.mtime))} · ${fmtSize(d.size)}</span></figcaption>
  ${(d.chapters || []).length ? `<ol class="chapters">${d.chapters.map(c => `<li><button type="button" class="chapter" data-seek="${c.t}"><span class="mono">${fmtClock(c.t)}</span> ${esc(c.label)}${c.result ? ` <b style="color:var(--${FIXED[c.result.toLowerCase()] || (c.result === "PASS" ? "pass" : c.result === "FAIL" ? "fail" : "muted")})">${esc(c.result)}</b>` : ""}</button></li>`).join("")}</ol>` : ""}</figure>`;
function renderDemos(b) {
  const sec = document.getElementById("demos-sec");
  sec.hidden = b.demos == null;
  if (b.demos == null) return;
  document.getElementById("h-demos").textContent = `MVP 演示 · ${b.demos.length}`;
  put(document.getElementById("demos")).innerHTML = b.demos.length ? `<div class="demos-grid">${b.demos.map(d => demoFigure(b, d, false)).join("")}</div>`
    : `<div class="muted">还没有演示视频。把录好的 mp4 / webm / mov 放进看板 root 下的 <span class="mono">${esc(b.demo_dir || ".")}/</span>，几秒内就会出现在这里；文件名用卡号或子计划 id 开头（如 <span class="mono">10001-void-all.mp4</span>），会自动挂到对应的卡片和子计划上。</div>`;
}
function renderCloseout(b) {
  const c = b.closeout, sec = document.getElementById("closeout-sec");
  sec.hidden = !c;
  if (!c) return;
  const done = (c.items || []).filter(i => i.done).length, total = (c.items || []).length;
  document.getElementById("h-closeout").textContent = c.exists ? `收尾 · ${c.state === "done" ? "已完成" : c.state}${total ? ` · ${done}/${total}` : ""}` : "收尾 · 未开始";
  put(document.getElementById("closeout")).innerHTML = !c.exists
    ? `<div class="muted">还没收尾。任务进入 Ready For AC 后按 task-closeout 收尾，<span class="mono">${esc(c.file)}</span> 写出来就会显示在这里。</div>`
    : `<ul class="checklist">${c.items.map(i => `<li class="${i.done ? "done" : ""}"><span class="mark">${i.done ? "✔" : "○"}</span>${esc(i.text)}</li>`).join("")}</ul>
      <div class="closeout-tables">${Object.entries(c.tables || {}).map(([name, rows]) => `<details><summary><b>${esc(name)}</b> <span class="mono">${rows.length}</span></summary>
        <table class="mini"><tbody>${rows.map(r => `<tr>${r.map(cell => `<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></details>`).join("")}</div>
      <div class="s">记录：${fileLink(b, c.file, c.file.split("/").pop())}${c.mtime ? ` · ${esc(fmtTime(c.mtime))}` : ""}</div>`;
}
function openDemos(b, tag) {
  const list = demosFor(b, tag); if (!list.length) return;
  document.getElementById("dlg-title").textContent = `${tag} · MVP 演示（${list.length}）`;
  document.getElementById("dlg-body").innerHTML = list.map((d, i) => demoFigure(b, d, i === 0)).join("");
  dlg.showModal();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-demo-tag]"); if (!t) return;
  e.preventDefault(); e.stopPropagation();
  const b = current(); if (b) openDemos(b, t.dataset.demoTag);
}, true);
document.getElementById("dlg").addEventListener("close", e => e.target.querySelectorAll("video").forEach(v => v.pause()));

function renderCards(b) {
  const box = document.getElementById("cards"); if (!box) return;
  put(box).innerHTML = Object.entries(b.cards).map(([code, name]) => {
    const all = (b.rows || []).filter(r => r.card === code), rows = counted({ ...b, rows: all });
    if (rows.length) return `<button type="button" class="card" data-card="${esc(code)}" aria-pressed="${filters.card === code}" title="AC 表只看这张卡"><span class="code">${esc(code)}${demoBadge(b, code)}</span>${name !== code ? `<span class="name">${esc(name)}</span>` : ""}<div class="bar">${barHtml(b, rows)}</div><span class="meta mono">${rows.filter(r => r.status === "PASS").length} 通过 / ${rows.length} 可测 · 共 ${all.length}</span></button>`;
    const chips = (b.plans || []).filter(p => (p.covers || []).includes(code)).map(p => { const st = p.tracked ? progressState(p.done, p.tasks) : p.state === "done" ? "done" : "now"; return `<span class="pill mono" style="color:var(--${st === "done" ? "pass" : st === "now" ? "info" : "muted"})">${esc(p.id)} ${p.tracked ? `${p.done}/${p.tasks}` : p.state === "done" ? "✓" : "…"}</span>`; }).join(" ");
    return `<button type="button" class="card" data-card="${esc(code)}" aria-pressed="${filters.card === code}" title="AC 表只看这张卡"><span class="code">${esc(code)}${demoBadge(b, code)}</span>${name !== code ? `<span class="name">${esc(name)}</span>` : ""}<div class="meta">${all.length} 条待验${chips ? " · 子计划" : ""}</div><div style="display:flex;flex-wrap:wrap;gap:4px">${chips}</div></button>`;
  }).join("");
}

const TABLE_COLUMNS = [["card", "卡", "mono"], ["ac", "AC", "mono"], ["desc", "内容", ""], ["cat", "类别", ""], ["group", "组", "mono"],
  ["status", "状态", ""], ["qam", "核对", "note"], ["issue", "Issue", "mono"], ["shots", "证据", "cam mono"]];
function tableColumns(rows) {
  const values = key => new Set(rows.map(r => String(r[key] ?? "").trim()).filter(v => v && v !== "—"));
  return TABLE_COLUMNS.filter(([key]) => key === "ac" || key === "status" ? true
    : key === "shots" ? rows.some(r => (r.shots || []).length)
    : key === "card" || key === "group" ? values(key).size > 1 : values(key).size > 0);
}
function cellHTML(b, r, key) {
  if (key === "status") return `<span class="pill" style="color:${col(b, r.status)}">${esc(r.final)}</span>`;
  if (key === "shots") return r.shots && r.shots.length ? "▣ " + r.shots.length : "";
  return esc(r[key] === "—" ? "" : r[key]);
}

function renderTable(b) {
  const tbody = document.getElementById("rows"); if (!tbody || !b) return;
  const present = (b.statuses || []).filter(s => (b.rows || []).some(r => r.status === s.id));
  put(document.getElementById("f-buckets")).innerHTML = present.map(s => `<button type="button" class="chip" aria-pressed="${filters.active.has(s.id)}" data-b="${esc(s.id)}"><i class="dot" style="background:var(--${s.color})"></i> ${esc(s.label)} <span class="mono">${b.rows.filter(r => r.status === s.id).length}</span></button>`).join("");
  const q = filters.q.trim().toLowerCase();
  put(document.getElementById("f-group")).innerHTML = filters.group ? `<button type="button" class="chip" data-clear-group aria-pressed="true">组 ${esc(filters.group)} ✕</button>` : "";
  shown = b.rows.filter(r => (!filters.card || r.card === filters.card) && (!filters.group || r.group === filters.group) && (!filters.active.size || filters.active.has(r.status)) &&
    (!q || [r.ac, r.desc, r.cat, r.how, r.final, r.qam, r.issue].join(" ").toLowerCase().includes(q)));
  document.getElementById("f-count").textContent = `${shown.length} 条`;
  const cols = tableColumns(b.rows);
  put(document.getElementById("thead")).innerHTML = `<tr>${cols.map(([, label]) => `<th>${label}</th>`).join("")}</tr>`;
  put(tbody).innerHTML = shown.map((r, i) => `<tr tabindex="0" data-i="${i}">${cols.map(([key, , cls]) => `<td class="${cls}">${cellHTML(b, r, key)}</td>`).join("")}</tr>`).join("");
}

const dlg = document.getElementById("dlg");
function openRow(b, i) { if (shown[i]) openAc(b, shown[i]); }
function openAc(b, r) {
  document.getElementById("dlg-title").textContent = `${r.card} ${r.ac} · ${r.final}`;
  const fileUrl = s => fileHref(b, s);
  document.getElementById("dlg-body").innerHTML = `<div><b>${esc(r.cat)}</b> · ${esc(r.how)} · 组 ${esc(r.group)}</div>
    ${r.qa && r.qa !== r.final ? `<div><span class="muted">QA 结论：</span>${esc(r.qa)}</div>` : ""}
    ${r.qam && r.qam !== "—" ? `<div><span class="muted">QA Manager：</span>${esc(r.qam)}</div>` : ""}
    ${(r.shots || []).map(s => `<figure style="margin:0"><figcaption class="mono muted" style="font-size:12px;margin-bottom:4px">${esc(s)}</figcaption><img loading="lazy" src="${fileUrl(s)}" alt="${esc(r.ac)} 证据截图"></figure>`).join("") || `<div class="muted">这条还没有截图证据。</div>`}`;
  dlg.showModal();
}
document.getElementById("dlg-close").addEventListener("click", () => dlg.close());

const archived = {};
function current() {
  const r = route();
  if (r?.archive) { if (!archived[r.archive]) loadArchive(r.archive); return archived[r.archive] || null; }
  return r && allBoards().find(b => b.session === r.session && b.id === r.id && !b.offline);
}
const archiveLoading = new Set();
function loadArchive(id) {
  if (archiveLoading.has(id)) return;
  archiveLoading.add(id);
  fetch(`/api/archive?id=${encodeURIComponent(id)}`).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(snap => { archived[id] = { ...snap, archived: true }; render(true); })
    .catch(() => { toast("这份归档已经不在了"); location.hash = "#/"; })
    .finally(() => archiveLoading.delete(id));
}
async function postJSON(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  return res.ok ? { ok: true, data: await res.json() } : { ok: false, error: await res.text() };
}
document.addEventListener("click", async e => {
  const arc = e.target.closest("[data-archive-board]"), rst = e.target.closest("[data-restore]");
  if (!arc && !rst) return;
  e.preventDefault();
  if (arc) {
    const b = current(); if (!b) return;
    if (!confirm(`归档「${b.name}」？\n\n会保存此刻的完整快照（AC、缺陷、计划、worker、动态），并从总览移到「已归档」。之后可以随时恢复。`)) return;
    const res = await postJSON("/api/archive", { session: b.session, board: b.id });
    if (!res.ok) return toast(`归档失败：${esc(res.error)}`);
    toast(`已归档「${esc(b.name)}」`); location.hash = `#/a/${encodeURIComponent(res.data.archive)}`;
  } else {
    const id = rst.dataset.restore;
    if (!confirm("恢复这块看板？快照会被删除，看板重新回到总览。")) return;
    const res = await postJSON("/api/restore", { archive: id });
    if (!res.ok) return toast(`恢复失败：${esc(res.error)}`);
    delete archived[id]; toast("已恢复，几秒后出现在总览"); location.hash = "#/";
  }
});

function render(routeChanged) {
  if (!STATE?.sessions) return;
  if ((pointerDown || document.activeElement?.classList?.contains("reply-text")) && !routeChanged) { renderQueued = true; return; }
  const b = current(), key = b ? boardKey(b) : "overview";
  if (b && b.slim) {
    if (view !== "loading") { put(document.getElementById("app")).innerHTML = `<div class="panel muted">加载中…</div>`; view = "loading"; }
    loadState();
    return;
  }
  if (!b) { renderOverview(); mountRail(); renderRail(); view = key; firstRender = false; return; }
  if (view !== key) { filters.card = ""; filters.q = ""; filters.active.clear(); filters.group = ""; issuesOpenOnly = true; renderBoardShell(b); view = key; }
  const needs = b.needs || [], waiting = (STATE.decisions || []).filter(d => d.session === b.session && d.board === b.id);
  mountRail(); renderHero(b);
  document.getElementById("needs-sec").hidden = !needs.length && !waiting.length;
  put(document.getElementById("needs")).innerHTML = needsBlock(waiting, needs, b, false);
  document.getElementById("ok-badge").hidden = needs.length + waiting.length > 0;
  document.getElementById("sub-here").textContent = isSubscribed(b) ? "★ 已订阅 · 取消" : "☆ 订阅这块看板";
  document.getElementById("sub-here").hidden = !!b.archived;
  renderAgents(b); renderRail(); renderDemos(b); renderCloseout(b); renderSide(b); renderCards(b); renderTable(b);
  if (scrollToFocus) {
    scrollToFocus = false;
    const el = route()?.worker && document.querySelector(`.agent[data-w="${CSS.escape(route().worker)}"]`);
    el ? el.scrollIntoView({ block: "center" }) : scrollTo(0, 0);
  }
  if (pendingEvent && pendingEvent.board === key) { const { kind, ref } = pendingEvent; pendingEvent = null; runEvent(b, kind, ref); }
  firstRender = false;
}
addEventListener("hashchange", () => { firstRender = true; scrollToFocus = true; connect(); render(true); });

const live = document.getElementById("live"), liveText = document.getElementById("live-text");
let stream = null, streamFocus = null, stateLoading = false;
const focusKey = () => { const r = route(); return r && !r.archive ? `${r.session}/${r.id}` : ""; };
function connect() {
  const focus = focusKey();
  if (stream && streamFocus === focus) return;
  stream?.close();
  streamFocus = focus;
  stream = new EventSource(`/api/stream?board=${encodeURIComponent(focus)}`);
  stream.onmessage = e => {
    const data = JSON.parse(e.data);
    if (streamFocus !== focusKey()) return;
    live.classList.add("on"); STATE = data; render(false); liveText.textContent = "实时 · " + (STATE.updated || "").slice(11);
  };
  stream.onerror = () => { live.classList.remove("on"); liveText.textContent = "连接断开，重连中…"; };
}
function loadState() {
  if (stateLoading) return;
  stateLoading = true;
  fetch(`/api/state?board=${encodeURIComponent(focusKey())}`).then(r => r.json())
    .then(d => { if (d.sessions) { STATE = d; scrollToFocus = true; render(true); } })
    .catch(() => {}).finally(() => { stateLoading = false; });
}
loadState();
connect();
</script>
